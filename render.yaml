services:
  - type: web
    name: campus-parking-ai
    env: docker
    plan: free
    region: oregon
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ENABLE_SIMULATION
        value: "true"
      - key: DATABASE_URL
        value: sqlite:////var/data/campus_parking.db
    disk:
      name: parking-data
      mountPath: /var/data
      sizeGB: 1
